<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="MOHAMED EL NAGGAR — Digital Business Card">
<title>MOHAMED EL NAGGAR | Digital Card</title>

<style>
:root {
  --ink:#171717;
  --muted:#777;
  --line:#ededed;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:#f7f7f7;
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
}

.card {
  width:min(100%,390px);
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:38px 26px 28px;
  text-align:center;
  box-shadow:0 18px 55px rgba(0,0,0,.055);
}

.card-header {
  position:relative;
  margin-bottom:22px;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mark {
  width:158px;
  height:68px;
  margin:0;
  border:0;
  border-radius:0;
  display:grid;
  place-items:center;
  overflow:visible;
}

.mark img {
  width:100%;
  height:100%;
  max-height:none;
  object-fit:contain;
  display:block;
}

.email-icons {
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.email-icon {
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  color:#171717;
  text-decoration:none;
  opacity:.82;
  transition:.18s ease;
}

.email-icon:hover {
  opacity:1;
  transform:translateY(-1px);
}

.email-icon svg {
  width:23px;
  height:23px;
  display:block;
}

h1 {
  margin:0;
  font-size:23px;
  font-weight:700;
  letter-spacing:1.1px;
}


.role {
  margin:0 0 28px;
  color:#555;
  font-size:11px;
  font-weight:700;
  letter-spacing:.15px;
}

.links {
  display:grid;
  gap:11px;
}

.action {
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--ink);
  text-decoration:none;
  font-size:14px;
  font-weight:550;
  transition:.18s ease;
}

.action:hover {
  border-color:#bdbdbd;
  transform:translateY(-1px);
}

.icon {
  width:20px;
  height:20px;
  display:inline-grid;
  place-items:center;
}

.icon svg {
  width:20px;
  height:20px;
}

.payments {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.payment-link {
  width:130px;
  min-height:58px;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  cursor:pointer;
  text-decoration:none;
  transition:.18s ease;
  padding:4px;
}

.payment-link:hover {
  transform:translateY(-2px);
}

.payment-link svg {
  width:100%;
  height:52px;
}

.toast {
  min-height:18px;
  margin:10px 0 0;
  color:#555;
  font-size:12px;
}

.save {
  width:100%;
  margin-top:18px;
  min-height:52px;
  border:0;
  border-radius:13px;
  background:#171717;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

async function copyPayment(value,message) {
  const status = document.getElementById("copyStatus");

  try {
    await navigator.clipboard.writeText(value);
    status.textContent = message + " — " + value;
  } catch(error) {
